<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGen Alliance — Login</title>
  <meta name="description" content="Secure access to CareGen Alliance Revenue Intelligence Dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #060d1a;
      --bg-secondary: #0c1524;
      --bg-card: rgba(17,28,48,0.9);
      --bg-input: #152030;
      --border: #1a3355;
      --border-hover: #2a4a75;
      --text-primary: #f0f4f8;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --accent-blue: #004797;
      --accent-blue-hover: #0960c4;
      --accent-blue-glow: rgba(0,71,151,0.2);
      --accent-gold: #FDB913;
      --accent-gold-hover: #fdd34a;
      --accent-gold-glow: rgba(253,185,19,0.15);
      --error: #ef4444;
      --error-bg: rgba(239,68,68,0.1);
      --radius: 14px;
      --radius-sm: 10px;
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,71,151,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,71,151,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .bg-glow-blue {
      position: fixed; z-index: 0;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,71,151,0.12) 0%, transparent 70%);
      top: 30%; left: 30%; transform: translate(-50%, -50%);
      animation: driftBlue 10s ease-in-out infinite;
    }
    .bg-glow-gold {
      position: fixed; z-index: 0;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(253,185,19,0.08) 0%, transparent 70%);
      top: 70%; left: 70%; transform: translate(-50%, -50%);
      animation: driftGold 12s ease-in-out infinite;
    }
    @keyframes driftBlue {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-45%, -55%) scale(1.1); }
    }
    @keyframes driftGold {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.9; transform: translate(-55%, -45%) scale(1.12); }
    }

    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      padding: 0 24px;
      animation: fadeUp 0.6s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo / Brand */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-icon {
      width: 80px; height: 80px;
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      animation: float 6s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .brand-icon img {
      width: 80px; height: 80px;
      object-fit: cover;
      border-radius: 18px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .brand-icon svg { width: 34px; height: 34px; fill: #fff; }
    .brand h1 {
      font-size: 26px; font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--accent-gold-hover));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand p {
      font-size: 13px; color: var(--text-tertiary);
      margin-top: 6px; font-weight: 400;
    }

    /* Card */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(24px);
    }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-icon {
      position: absolute; left: 14px;
      width: 18px; height: 18px;
      color: var(--text-tertiary);
      pointer-events: none;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
    }
    .input-icon svg { width: 18px; height: 18px; }

    .input-field {
      width: 100%;
      padding: 13px 14px 13px 44px;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      transition: var(--transition);
    }
    .input-field.has-toggle { padding-right: 48px; }
    .input-field:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px var(--accent-blue-glow);
    }
    .input-wrapper:focus-within .input-icon { color: var(--accent-blue); }
    .input-field::placeholder { color: var(--text-tertiary); }

    .toggle-password {
      position: absolute; right: 12px;
      background: none; border: none;
      color: var(--text-tertiary); cursor: pointer;
      padding: 6px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      transition: var(--transition);
      z-index: 2;
    }
    .toggle-password:hover { color: var(--accent-gold); background: rgba(253,185,19,0.1); }
    .toggle-password svg { width: 18px; height: 18px; }

    .login-btn {
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent-blue), #003670);
      color: #fff;
      font-family: inherit;
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.3px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .login-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent, rgba(245,158,11,0.15));
      opacity: 0;
      transition: var(--transition);
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0,71,151,0.45);
    }
    .login-btn:hover::before { opacity: 1; }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled {
      opacity: 0.6; cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .login-btn .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .login-btn.loading .btn-text { visibility: hidden; }
    .login-btn.loading .spinner {
      display: inline-block; position: absolute;
      left: 50%; top: 50%; margin: -9px 0 0 -9px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--error-bg);
      border: 1px solid rgba(239,68,68,0.2);
      color: var(--error);
      font-size: 13px;
      text-align: center;
    }
    .error-msg.visible { display: block; animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .footer a { color: var(--accent-gold); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* Gold accent line at top of card */
    .login-card::before {
      content: '';
      display: block;
      height: 3px;
      margin: -32px -32px 24px -32px;
      border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold), var(--accent-blue));
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-blue"></div>
  <div class="bg-glow-gold"></div>

  <div class="login-container">
    <div class="brand">
      <div class="brand-icon">
        <img src="/caregen-logo.png" alt="CareGen Alliance" />
      </div>
      <h1>CareGen Alliance</h1>
      <p>Revenue Intelligence Platform</p>
    </div>

    <div class="login-card">
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="username" class="input-field" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="password" class="input-field has-toggle" placeholder="Enter your password" required>
            <button type="button" class="toggle-password" id="togglePw" tabindex="-1" aria-label="Toggle password visibility">
              <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner"></div>
        </button>

        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>

    <div class="footer">
      &copy; 2026 CareGen Alliance &middot; <a href="https://f1rstposition.com">F1rst Position</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const togglePw = document.getElementById('togglePw');
    const pwField = document.getElementById('password');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    // Toggle password visibility
    togglePw.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (pwField.type === 'password') {
        pwField.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
      } else {
        pwField.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (data.success) {
          document.querySelector('.login-container').style.opacity = '0';
          document.querySelector('.login-container').style.transform = 'translateY(-10px)';
          document.querySelector('.login-container').style.transition = '0.3s ease';
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 300);
        } else {
          errorMsg.textContent = data.message || 'Invalid credentials';
          errorMsg.classList.add('visible');
          loginBtn.classList.remove('loading');
          loginBtn.disabled = false;
          pwField.focus();
          pwField.select();
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('visible');
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
