<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGen Alliance — Login</title>
  <meta name="description" content="Secure access to CareGen Alliance Revenue Intelligence Dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #16161f;
      --bg-input: #1e1e2a;
      --border: #2a2a3a;
      --border-hover: #3a3a4f;
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b5;
      --text-tertiary: #606075;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99,102,241,0.15);
      --error: #ef4444;
      --error-bg: rgba(239,68,68,0.1);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .bg-glow {
      position: fixed; z-index: 0;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      padding: 0 24px;
    }

    /* Logo / Brand */
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(99,102,241,0.3);
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .brand-icon svg { width: 32px; height: 32px; fill: #fff; }
    .brand h1 {
      font-size: 24px; font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-hover));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand p {
      font-size: 13px; color: var(--text-tertiary);
      margin-top: 6px; font-weight: 400;
    }

    /* Card */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper svg {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--text-tertiary);
      pointer-events: none;
      transition: var(--transition);
    }
    .input-field {
      width: 100%;
      padding: 12px 14px 12px 44px;
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      transition: var(--transition);
    }
    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .input-field:focus + svg,
    .input-wrapper:focus-within svg {
      color: var(--accent);
    }
    .input-field::placeholder {
      color: var(--text-tertiary);
    }

    .toggle-password {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-tertiary); cursor: pointer;
      padding: 4px; display: flex;
      transition: var(--transition);
    }
    .toggle-password:hover { color: var(--text-primary); }
    .toggle-password svg { width: 18px; height: 18px; }

    .login-btn {
      width: 100%;
      padding: 13px 24px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      font-family: inherit;
      font-size: 14px; font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled {
      opacity: 0.6; cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .login-btn .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .login-btn.loading .btn-text { visibility: hidden; }
    .login-btn.loading .spinner { display: inline-block; position: absolute; left: 50%; top: 50%; margin: -9px 0 0 -9px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--error-bg);
      border: 1px solid rgba(239,68,68,0.2);
      color: var(--error);
      font-size: 13px;
      text-align: center;
      animation: shake 0.4s ease;
    }
    .error-msg.visible { display: block; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-tertiary);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }

    /* Subtle entrance animation */
    .login-container {
      animation: fadeUp 0.6s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="login-container">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4zM5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
      </div>
      <h1>CareGen Alliance</h1>
      <p>Revenue Intelligence Platform</p>
    </div>

    <div class="login-card">
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <input type="text" id="username" class="input-field" placeholder="Enter your username" required autofocus>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="input-field" placeholder="Enter your password" required>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <button type="button" class="toggle-password" id="togglePw" tabindex="-1">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner"></div>
        </button>

        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>

    <div class="footer">
      &copy; 2026 CareGen Alliance &middot; <a href="https://f1rstposition.com">F1rst Position</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const togglePw = document.getElementById('togglePw');
    const pwField = document.getElementById('password');

    // Toggle password visibility
    togglePw.addEventListener('click', () => {
      const isPassword = pwField.type === 'password';
      pwField.type = isPassword ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (data.success) {
          // Smooth transition
          document.querySelector('.login-container').style.opacity = '0';
          document.querySelector('.login-container').style.transform = 'translateY(-10px)';
          document.querySelector('.login-container').style.transition = '0.3s ease';
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 300);
        } else {
          errorMsg.textContent = data.message || 'Invalid credentials';
          errorMsg.classList.add('visible');
          loginBtn.classList.remove('loading');
          loginBtn.disabled = false;
          // Shake the password field
          pwField.focus();
          pwField.select();
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.add('visible');
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
